<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administração</title>
    <link rel="stylesheet" href="/front/assets/css/styles.css">
    <link rel="icon" type="image/x-icon" href="/front/img/favicon.ico">
</head>
<body class="body_index_cadastro">
    <header class="header_index_cadastro">
        <figure class="logo"><a href="/front/index.html" class="hrefs"><img src="/front/img/logo.svg" alt="LOGOTIPO StarDev"></figure>
        <button><a href="/front/index.html" target="_blank">tela inicial</a></button>
        <button><a href="/front/login.html" target="_blank">login</a></button>
        <button><a href="/front/cadastro.html" target="_blank">cadastro</a></button>
        <button><a href="/front/admin/editarAulas.html" target="_blank">editar Aulas</a></button>
        <button><a href="/front/aulas1/esqueleto.html" target="_blank">aulas</a></button>
    </header>
    
    <main>
        <!-- FORMULÁRIO -->
        <form id="formVideo">
            <label class="label_admin" id="label_nomeaula">Nome da Aula</label>
            <br>
            <input
                type="text"
                id="nome"
                required
                minlength="5"
                maxlength="100"
                pattern=".*\S.*"
            >
            <br>
            <label class="label_admin" id="label_descricao">Descrição</label>
            <br>
            <textarea
                id="descricao"
                required
                minlength="15"
                maxlength="500"
            ></textarea>
            <br>
            <label class="label_admin" id="label_linkvideo">Link do vídeo</label>
            <br>
            <input
                type="url"
                id="link"
                required
                placeholder="https://www.youtube.com/watch?v=..."
            >
            <br>
            <label id="label_idmateria">ID da matéria</label>
            <br>
            <input type="number" id="materia" required>
            <div id="listamaterias"></div>
            <button type="submit">Salvar</button>
        </form>
        <hr>
        <table border="1">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Descrição</th>
                    <th>Matéria</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabela">
                <!-- as aulas aparecem aqui -->
            </tbody>
        </table>
    </main>
    <footer id="footer_index_cadastro">Se você está lendo isso, parabéns você é um admin</footer>
    <script>
        const API = "https://stardev-d20v.onrender.com/videoaulas";
        const API_MATERIAS = "https://stardev-d20v.onrender.com/aulas";

        const token = localStorage.getItem("token");

        if (!token) {
            alert("Você precisa fazer login novamente.");
            window.location.href = "/front/login.html";
        }

        let editandoId = null;

        const form = document.getElementById("formVideo");
        const tabela = document.getElementById("tabela");
        const listaMaterias = document.getElementById("listamaterias");

        // ================================
        // CARREGA AS MATÉRIAS
        // ================================
        async function carregarMaterias() {

            try {

                const resposta = await fetch(API_MATERIAS);

                if (!resposta.ok) {
                    throw new Error("Erro ao buscar matérias.");
                }

                const materias = await resposta.json();

                console.log("Matérias:", materias);

                listaMaterias.innerHTML = "";

                if (materias.length === 0) {

                    listaMaterias.innerHTML = `
                        <p>Nenhuma matéria cadastrada.</p>
                    `;

                    return;
                }

                materias.forEach(materia => {

                    listaMaterias.innerHTML += `
                        <p>
                            <strong>ID ${materia.id_aula}</strong> -
                            ${materia.materia}
                        </p>
                    `;

                });

            } catch (erro) {

                console.error(erro);

                listaMaterias.innerHTML =
                    "<p>Erro ao carregar matérias.</p>";

            }

        }

        // ================================
        // CARREGA VIDEOAULAS
        // ================================
        async function carregarVideoAulas() {

            try {

                const resposta = await fetch(API);

                if (!resposta.ok) {
                    throw new Error("Erro ao buscar videoaulas");
                }

                const videos = await resposta.json();

                tabela.innerHTML = "";

                if (videos.length === 0) {

                    tabela.innerHTML = `
                        <tr>
                            <td colspan="4">
                                Nenhuma videoaula cadastrada.
                            </td>
                        </tr>
                    `;

                    return;
                }

                videos.forEach(video => {

                    tabela.innerHTML += `
                        <tr>

                            <td>${video.nome_aulas}</td>

                            <td>${video.descricao}</td>

                            <td>${video.materia}</td>

                            <td>

                                <button onclick="editar(${video.id_materias})">
                                    Editar
                                </button>

                                <button onclick="excluir(${video.id_materias})">
                                    Excluir
                                </button>

                            </td>

                        </tr>
                    `;

                });

            } catch (erro) {

                console.log(erro);

                alert("Erro ao carregar videoaulas.");

            }

        }
        // ================================
        // SALVAR
        // ================================
        form.addEventListener("submit", async function (e) {

            e.preventDefault();

            const dados = {

                nome_aulas: document.getElementById("nome").value.trim(),

                descricao: document.getElementById("descricao").value.trim(),

                link: document.getElementById("link").value.trim(),

                id_aula: Number(document.getElementById("materia").value)

            };

            if (
                dados.nome_aulas === "" ||
                dados.descricao === "" ||
                dados.link === "" ||
                !dados.id_aula
            ) {

                alert("Preencha todos os campos.");
                return;

            }

            // Validação do nome
            if (dados.nome_aulas.length < 5) {
                alert("O nome da aula deve possuir pelo menos 5 caracteres.");
                return;
            }

            // Validação da descrição
            if (dados.descricao.length < 15) {
                alert("A descrição deve possuir pelo menos 15 caracteres.");
                return;
            }

            // Aceita somente links do YouTube
            const youtubeRegex =
            /^(https?:\/\/)?(www\.)?(youtube\.com\/watch\?v=|youtu\.be\/)[\w-]{11}/;

            if (!youtubeRegex.test(dados.link)) {
                alert("Digite um link válido do YouTube.");
                return;
            }

            try {
                const token = localStorage.getItem("token");

                const resposta = await fetch(
                    editandoId ? `${API}/${editandoId}` : API,
                    {
                        method: editandoId ? "PUT" : "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "Authorization": `Bearer ${token}`
                        },
                        body: JSON.stringify(dados)
                    }
                );
                const resultado = await resposta.json();

                alert(resultado.message);

                form.reset();

                editandoId = null;

                carregarVideoAulas();

            } catch (erro) {

                console.log(erro);

                alert("Erro ao salvar.");

            }

        });

        // ================================
        // EDITAR
        // ================================
        async function editar(id) {

            try {

                const resposta = await fetch(API);

                const videos = await resposta.json();

                const video = videos.find(v => v.id_materias == id);

                if (!video) {

                    alert("Videoaula não encontrada.");
                    return;

                }

                editandoId = id;

                document.getElementById("nome").value = video.nome_aulas;
                document.getElementById("descricao").value = video.descricao;
                document.getElementById("link").value = video.link;
                document.getElementById("materia").value = video.id_aula;

                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });

            } catch (erro) {

                console.log(erro);

            }

        }

        // ================================
        // EXCLUIR
        // ================================
        async function excluir(id) {

            const confirmar = confirm("Deseja excluir esta videoaula?");

            if (!confirmar) return;

            try {

                await fetch(`${API}/${id}`, {

                    method: "DELETE",
                    headers: {
                        "Authorization": `Bearer ${token}`
                    }

                });

                alert("Videoaula excluída.");

                carregarVideoAulas();

            } catch (erro) {

                console.log(erro);

                alert("Erro ao excluir.");

            }

        }

        // ================================
        // INICIAR
        // ================================
        carregarMaterias();
        carregarVideoAulas();
    </script>
</body>
</html>
