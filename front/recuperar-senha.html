    <a href="index.html" class="logo">
      <span class="logo-mark"><svg viewBox="0 0 24 20" fill="none"><path d="M2 3L10 10L2 17" stroke="#F2E8E0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="12" y1="17" x2="20" y2="17" stroke="#F2E8E0" stroke-width="2.6" stroke-linecap="round"/></svg></span>

<main class="pagina-auth" id="conteudo" tabindex="-1">
  <div class="container" style="max-width:520px;">
    <div class="form-card reveal">
      <span class="eyebrow">recuperação de acesso</span>
      <h1 style="font-size:24px; margin-top:12px;">Esqueci minha senha</h1>
      <p style="color:#4a373c; margin-top:8px; font-size:14.5px;">Confirme seu e-mail cadastrado e defina uma nova senha.</p>

      <div class="form-aviso" id="recAviso" role="status" aria-live="polite"></div>

      <!-- ETAPA 1: confirmar e-mail -->
      <form id="formEmailRec" style="margin-top:24px;">
        <div class="campo">
          <label for="recEmail">E-mail cadastrado</label>
          <input type="email" id="recEmail" name="email" required placeholder="voce@email.com" />
        </div>
        <button type="submit" class="btn btn-primario btn-block" id="btnVerificarEmail">Verificar e-mail</button>
      </form>

      <!-- ETAPA 2: nova senha (escondida até verificar o e-mail) -->
      <form id="formNovaSenha" style="margin-top:22px; display:none;">
        <div class="campo">
          <label for="recNovaSenha">Nova senha</label>
          <div class="input-wrap">
            <input type="password" id="recNovaSenha" name="novaSenha" required minlength="6" placeholder="Digite a nova senha" />
            <button type="button" class="btn-olho" data-olho-de="recNovaSenha" aria-label="Mostrar senha"></button>
          </div>
        </div>
        <div class="campo">
          <label for="recNovaSenhaConfirma">Confirmar nova senha</label>
          <div class="input-wrap">
            <input type="password" id="recNovaSenhaConfirma" name="novaSenhaConfirma" required minlength="6" placeholder="Repita a nova senha" />
            <button type="button" class="btn-olho" data-olho-de="recNovaSenhaConfirma" aria-label="Mostrar senha"></button>
          </div>
        </div>
        <button type="submit" class="btn btn-primario btn-block" id="btnRedefinir">Redefinir senha</button>
      </form>

      <p class="form-rodape">Lembrou a senha? <a href="login.html">Voltar para o login</a></p>
    </div>
  </div>
</main>

<script src="assets/js/config.js"></script>

</html>
