<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/front/style.css">
    <link rel="icon" type="image/x-icon" href="/front/img/favicon.ico">
</head>
<body class="body_index_cadastro">
    <header class="header_index_cadastro">
        <figure class="logo">
            <a href="/front/index.html" target="_self" class="hrefs">
                <img src="/front/img/logo.svg" alt="LOGOTIPO StarDev">
            </a>
        </figure>
        <nav>
            <figure class="ftichome">
                <a href="/front/aulas.html" target="_self" class="hrefs">
                    <img src="/front/img/home.svg" alt="ICONE HOME">
                </a>
            </figure>
        </nav>
    </header>
    <main>
        <section class="carrossel-container">
            <section class="carrossel drag">
                <p class="card-aula roxo"><a href="/front/aulas1/esqueleto.html?materia=2" target="_blank" class="hrefs_au">Fundamentos da Programação</a></p>
                <p class="card-aula verde"><a href="/front/aulas1/esqueleto.html?materia=3" target="_blank" class="hrefs_au">Lógica de Programação</a></p>
                <p class="card-aula marrom"><a href="/front/aulas1/esqueleto.html?materia=4" target="_blank" class="hrefs_au">Desenvolvimento Web</a></p>
                <p class="card-aula amarelo"><a href="/front/aulas1/esqueleto.html?materia=5" target="_blank" class="hrefs_au">Front-end</a></p>
                <p class="card-aula roxo"><a href="/front/aulas1/esqueleto.html?materia=1" target="_blank" class="hrefs_au">Back-End</a></p>
                <p class="card-aula verde"><a href="/front/aulas1/esqueleto.html?materia=6" target="_blank" class="hrefs_au">Banco de Dados</a></p>
                <p class="card-aula marrom"><a href="/front/aulas1/esqueleto.html?materia=7" target="_blank" class="hrefs_au">Projetos</a></p>
                <p class="card-aula amarelo"><a href="/front/aulas1/esqueleto.html?materia=8" target="_blank" class="hrefs_au">Segurança da Informação</a></p>
                <p class="card-aula roxo"><a href="/front/aulas1/esqueleto.html?materia=9" target="_blank" class="hrefs_au">Código Limpo</a></p>
                <p class="card-aula verde"><a href="/front/aulas1/esqueleto.html?materia=10" target="_blank" class="hrefs_au">Desenvolvimento Mobile</a></p>
                <p class="card-aula marrom"><a href="/front/aulas1/esqueleto.html?materia=11" target="_blank" class="hrefs_au">Redes e IOT</a></p>
                <p class="card-aula amarelo"><a href="/front/aulas1/esqueleto.html?materia=12" target="_blank" class="hrefs_au">Linguagem de Programação</a></p>
            </section>
        </section>
        <section class="listarAulas" id="listaAulas">
            <p>Carregando aula...</p>
        </section>
    </main>
    <script>
        // CARROSSEL
        const carrossel = document.querySelector('.drag');
        let isDown = false;
        let startX;
        let scrollLeft;
        carrossel.addEventListener('mousedown', (e) => {
            isDown = true;
            startX = e.pageX - carrossel.offsetLeft;
            scrollLeft = carrossel.scrollLeft;
        });
        carrossel.addEventListener('mouseleave', () => {
            isDown = false;
        });
        carrossel.addEventListener('mouseup', () => {
            isDown = false;
        });
        carrossel.addEventListener('mousemove', (e) => {
            if (!isDown) return;
            e.preventDefault();
            const x = e.pageX - carrossel.offsetLeft;
            const walk = (x - startX) * 2;
            carrossel.scrollLeft = scrollLeft - walk;
        });
        // ===============================
        // AULAS CADASTRADAS NA INTRANET
        // ===============================
        const API = "https://stardev-d20v.onrender.com/videoaulas";
        // ID DA MATÉRIA VEM DA URL: esqueleto.html?materia=5
        const params = new URLSearchParams(window.location.search);
        const ID_MATERIA = Number(params.get("materia"));

        window.STARDEV_CONTEXT = {
            pagina: "esqueleto.html",
            materiaId: ID_MATERIA
        };

        const lista = document.getElementById("listaAulas");
        async function carregarAulas() {
            // Se a URL não trouxer o parâmetro "materia"
            if (!ID_MATERIA) {
                lista.innerHTML = `
                    <p class="erro-aulas">
                        Nenhuma matéria informada na URL.
                    </p>
                `;
                return;
            }
            try {
                const resposta = await fetch(API);
                if (!resposta.ok) {
                    throw new Error("Erro ao buscar as aulas");
                }
                const aulas = await resposta.json();
                console.log("Aulas recebidas:", aulas);
                lista.innerHTML = "";
                // Pega somente as aulas da matéria escolhida na URL
                const aulasMateria = aulas.filter(
                    aula => Number(aula.id_aula) === ID_MATERIA
                );
                console.log("Aulas da matéria " + ID_MATERIA + ":", aulasMateria);
                // Se não tiver aula
                if (aulasMateria.length === 0) {
                    lista.innerHTML = `
                        <p class="nenhuma-aula">
                            Nenhuma aula cadastrada para esta matéria.
                        </p>
                    `;
                    return;
                }
                // Mostra cada aula
                aulasMateria.forEach(aula => {
                    let link = aula.link;
                    // Link do YouTube:
                    // https://www.youtube.com/watch?v=ABC123
                    if (link.includes("watch?v=")) {
                        const codigo = link.split("watch?v=")[1].split("&")[0];
                        link = `https://www.youtube.com/embed/${codigo}`;
                    }
                    // Link do YouTube:
                    // https://youtu.be/ABC123
                    else if (link.includes("youtu.be/")) {
                        const codigo = link.split("youtu.be/")[1].split("?")[0];
                        link = `https://www.youtube.com/embed/${codigo}`;
                    }
                    lista.innerHTML += `
                        <article class="card-video">
                            <h2>${aula.nome_aulas}</h2>
                            <p>${aula.descricao}</p>
                            <iframe
                                src="${link}"
                                title="${aula.nome_aulas}"
                                width="100%"
                                height="450"
                                frameborder="0"
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                                allowfullscreen>
                            </iframe>
                        </article>
                    `;
                });
            } catch (erro) {
                console.error("ERRO AO CARREGAR AULAS:", erro);
                lista.innerHTML = `
                    <p class="erro-aulas">
                        Não foi possível carregar as aulas.
                    </p>
                `;
            }
        }
        carregarAulas();
    </script>
    <!-- CHATBOT -->
    <div id="chatbot_container"></div>
    <script>
    fetch("/front/chatfront/components/chatbot.html")
    .then(response => response.text())
    .then(data => {
        document.getElementById(
            "chatbot_container"
        ).innerHTML = data;
        const script =
            document.createElement("script");
        script.src =
            "/front/chatfront/js/chatbot.js";
        document.body.appendChild(script);

    });
    </script>
</body>
</html>
